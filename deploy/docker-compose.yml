# Le service de compte sur le VPS, à côté de Lamio et des outils (voir docs/DEPLOIEMENT.md).
#
# Le Caddy déjà en place occupe les ports 80 et 443. Ce service ne publie aucun port :
# il rejoint le réseau Docker de ce Caddy, qui le joint par son nom (compte:3000).
#
#   cd deploy && docker compose up -d --build

name: compte

services:
  app:
    build: ..
    container_name: compte
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATA_DIR: /data
      TZ: Europe/Zurich
      # SQLite et Node écrivent leurs fichiers temporaires ici (le reste est en lecture seule).
      TMPDIR: /tmp
    volumes:
      - app-data:/data
    # Ce qu'un intrus pourrait faire s'il prenait la main sur le serveur Node : presque rien.
    # Le système de fichiers de l'image est en lecture seule ; seules la base (/data) et deux
    # dossiers temporaires en mémoire, non exécutables, sont inscriptibles.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
      # Le cache de Next.js (pages régénérées) : refait au démarrage, inutile de le garder.
      - /app/.next/cache:size=128m,uid=1001,gid=1001,mode=0700,noexec,nosuid,nodev
    # Aucun privilège Linux : le service écoute sur 3000, il n'a besoin de rien d'autre.
    cap_drop: [ALL]
    # Aucun programme lancé dans le conteneur ne peut gagner de droits (setuid, sudo…).
    security_opt:
      - no-new-privileges:true
    # Une fuite de mémoire ou une boucle ne fait pas tomber Lamio et les outils voisins.
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.5
    pids_limit: 256
    init: true
    networks:
      default:
      proxy:
        aliases: [compte]

volumes:
  app-data:

networks:
  # Le réseau du Caddy en place. Sur un autre serveur : PROXY_NETWORK=<son réseau> dans deploy/.env.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-antoinequarroz-vitrine_appnet}
