name: Vérifications

on:
  push:
    branches: [main]
  pull_request:
  # Chaque lundi matin : une faille publiée pendant la semaine se voit même sans nouvelle PR.
  schedule:
    - cron: "0 6 * * 1"

# Le jeton de la CI ne peut que lire le dépôt.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Aucune faille haute ou critique dans les dépendances, outils de développement compris.
      - run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build

  # L'image Docker elle-même : le serveur, la sauvegarde et l'import Lamio y lancent node.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -t compte:ci .
      # Le serveur répond, et better-sqlite3 se charge sous son nom (sauvegarde, restauration, import).
      - run: |
          docker run --rm --entrypoint node compte:ci -e 'new (require("better-sqlite3"))(":memory:").close(); console.log(process.version)'
          docker run -d --name compte-ci -e COMPTE_URL=http://localhost:3000 -e AUTH_SECRET=ci-secret-ci-secret-ci-secret-ci-secret -p 3000:3000 compte:ci
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:3000/connexion && break; sleep 2; done
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:3000/connexion
          docker logs compte-ci | tail -20
